# Netlify yapılandırması
#
# Site statik olduğu için adaptöre gerek yok — `dist/` klasörü olduğu gibi yayınlanır.
# Canlı adres: https://boyacibulentusta.com
#
# NOT: `noindex` başlığı 2026-08-09'da KALDIRILDI — alan adı bağlandı, site artık
# arama motorlarına açık. Bir daha ön izleme amaçlı eklenirse yayına almadan önce
# tekrar silinmesi gerekir.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Güvenlik başlıkları
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Astro'nun ürettiği varlıkların adında içerik özeti (hash) var — içerik değişirse
# dosya adı da değişir. Bu yüzden süresiz önbelleğe alınabilirler.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# public/ içindeki sabit dosyalar — bir gün önbellek, günde bir doğrulama
[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
